<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="アシスタント" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-180.png" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./src/css/style.css" />
  <title>マイアシスタント</title>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1 id="page-title">今日</h1>
      <div id="header-action"></div>
    </header>

    <main id="view" class="view"></main>

    <nav class="tabbar" id="tabbar">
      <button class="tab" data-route="home">
        <span class="tab-icon">🏠</span><span class="tab-label">ホーム</span>
      </button>
      <button class="tab" data-route="calendar">
        <span class="tab-icon">📅</span><span class="tab-label">予定</span>
      </button>
      <button class="tab" data-route="money">
        <span class="tab-icon">💰</span><span class="tab-label">家計簿</span>
      </button>
      <button class="tab" data-route="todo">
        <span class="tab-icon">✅</span><span class="tab-label">TODO</span>
      </button>
      <button class="tab" data-route="memo">
        <span class="tab-icon">📝</span><span class="tab-label">メモ</span>
      </button>
    </nav>
  </div>

  <!-- モーダル用コンテナ -->
  <div id="modal-root"></div>

  <script type="module" src="./src/js/app.js"></script>
</body>
</html>
